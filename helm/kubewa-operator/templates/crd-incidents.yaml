---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: incidents.kubewa.dev
spec:
  group: kubewa.dev
  names:
    categories:
    - kubewa
    kind: Incident
    listKind: IncidentList
    plural: incidents
    shortNames:
    - inc
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.notifiedPhone
      name: NotifiedPhone
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Incident is the Schema for the incidents API.
          When an Incident CR is created the operator sends a WhatsApp alert with
          interactive remediation buttons to the current on-call person.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IncidentSpec defines the desired state of an Incident.
            properties:
              cluster:
                description: Cluster is the name of the target cluster (for multi-cluster
                  setups).
                type: string
              namespace:
                description: Namespace is the primary K8s namespace involved.
                type: string
              onCallScheduleRef:
                description: OnCallScheduleRef references the OnCallSchedule to determine
                  who to notify.
                minLength: 1
                type: string
              remediationActions:
                description: RemediationActions is the list of quick-action buttons
                  offered via WhatsApp.
                items:
                  description: RemediationActionSpec describes a single remediation
                    action available for the incident.
                  properties:
                    approvalRequired:
                      default: true
                      description: ApprovalRequired indicates whether this action
                        needs explicit WhatsApp confirmation.
                      type: boolean
                    name:
                      description: Name is a human-readable identifier for this action
                        (e.g. "rollback").
                      type: string
                    patch:
                      description: Patch is a strategic-merge-patch JSON string for
                        PatchDeployment actions.
                      type: string
                    replicas:
                      description: Replicas is the desired replica count for scale
                        actions.
                      format: int32
                      type: integer
                    targetName:
                      description: TargetName is the name of the target K8s resource.
                      type: string
                    targetNamespace:
                      description: |-
                        TargetNamespace is the namespace of the target resource.
                        Defaults to the incident namespace if omitted.
                      type: string
                    type:
                      description: Type is the kind of K8s action to perform.
                      enum:
                      - RollbackDeployment
                      - ScaleDeployment
                      - RestartDeployment
                      - PatchDeployment
                      - RollbackStatefulSet
                      - ScaleStatefulSet
                      - RestartStatefulSet
                      - CustomCommand
                      type: string
                  required:
                  - approvalRequired
                  - name
                  - targetName
                  - type
                  type: object
                maxItems: 3
                type: array
              severity:
                default: high
                description: Severity of the incident.
                enum:
                - critical
                - high
                - medium
                - low
                type: string
              source:
                description: Source indicates the origin of the incident (e.g. "prometheus",
                  "argocd", "manual").
                type: string
              sourceLabels:
                additionalProperties:
                  type: string
                description: SourceLabels carries labels from the originating alert
                  (e.g. Prometheus alert labels).
                type: object
              suggestedFix:
                description: SuggestedFix is an AI-generated remediation suggestion
                  in natural language.
                type: string
              title:
                description: Title is a short human-readable description of the incident.
                minLength: 1
                type: string
            required:
            - onCallScheduleRef
            - severity
            - title
            type: object
          status:
            description: IncidentStatus defines the observed state of an Incident.
            properties:
              ackedAt:
                description: AckedAt is the time the incident was acknowledged.
                format: date-time
                type: string
              ackedBy:
                description: AckedBy is the phone number that acknowledged the incident.
                type: string
              alertSentAt:
                description: AlertSentAt is when the initial WhatsApp alert was dispatched.
                format: date-time
                type: string
              auditTrail:
                description: AuditTrail contains a chronological record of all actions
                  taken.
                items:
                  description: AuditEntry records a single action taken during incident
                    handling.
                  properties:
                    action:
                      description: Action describes what was done.
                      type: string
                    actor:
                      description: Actor is the phone number or system that triggered
                        the action.
                      type: string
                    messageSID:
                      description: MessageSID is the Twilio SID of the WhatsApp message
                        that triggered this action.
                      type: string
                    result:
                      description: Result is "success" or an error message.
                      type: string
                    timestamp:
                      description: Timestamp is when the action was taken.
                      format: date-time
                      type: string
                  required:
                  - action
                  - actor
                  - result
                  - timestamp
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the incident's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              escalatedAt:
                description: EscalatedAt is when the incident was escalated to the
                  backup contact.
                format: date-time
                type: string
              lastMessageSID:
                description: LastMessageSID is the Twilio SID of the most recent WhatsApp
                  message sent.
                type: string
              notifiedPhone:
                description: NotifiedPhone is the phone number that received the latest
                  alert.
                type: string
              resolutionAction:
                description: ResolutionAction describes how the incident was resolved.
                type: string
              resolvedAt:
                description: ResolvedAt is the time the incident was resolved.
                format: date-time
                type: string
              state:
                description: State is the current lifecycle state of the incident.
                enum:
                - Open
                - Acked
                - Resolved
                - EscalatedToBackup
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
