apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubewa-operator.fullname" . }}-manager-role
  labels:
    {{- include "kubewa-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubewa.dev"]
    resources: ["oncallschedules", "incidents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubewa.dev"]
    resources: ["oncallschedules/status", "incidents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubewa.dev"]
    resources: ["oncallschedules/finalizers", "incidents/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubewa-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kubewa-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubewa-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kubewa-operator.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
