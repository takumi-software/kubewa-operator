---
apiVersion: v1
kind: Service
metadata:
  name: kubewa-operator-webhook
  namespace: system
  labels:
    app.kubernetes.io/name: kubewa-operator
    app.kubernetes.io/component: webhook
spec:
  selector:
    control-plane: controller-manager
  ports:
    - name: webhook
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
