    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OnCallSchedule is the Schema for the oncallschedules API.
          It defines rotating on-call personnel that receive WhatsApp incident alerts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OnCallScheduleSpec defines the desired state of OnCallSchedule.
            properties:
              ackTimeout:
                default: 15m
                description: |-
                  AckTimeout is the duration (e.g. "15m") to wait for acknowledgement
                  before escalating to the backup contact.
                type: string
              backup:
                description: |-
                  Backup is the fallback contact when the primary on-call person does not
                  acknowledge an incident within the AckTimeout.
                properties:
                  email:
                    description: Email is the optional email address for additional
                      notifications.
                    type: string
                  name:
                    description: Name is the display name of the on-call person.
                    minLength: 1
                    type: string
                  phone:
                    description: Phone is the WhatsApp-enabled phone number (E.164
                      format, e.g. +1234567890).
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
                required:
                - name
                - phone
                type: object
              podSelector:
                description: PodSelector restricts which pods this schedule applies
                  to via label selectors.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              rotation:
                default: weekly
                description: Rotation defines how often the on-call rotation shifts.
                enum:
                - daily
                - weekly
                type: string
              schedule:
                description: Schedule is the ordered list of on-call participants.
                items:
                  description: OnCallEntry represents a single on-call participant.
                  properties:
                    email:
                      description: Email is the optional email address for additional
                        notifications.
                      type: string
                    name:
                      description: Name is the display name of the on-call person.
