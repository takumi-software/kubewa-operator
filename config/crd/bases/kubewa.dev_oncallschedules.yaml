    kind: OnCallSchedule
    listKind: OnCallScheduleList
    plural: oncallschedules
    shortNames:
    - ocs
    singular: oncallschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.currentOnCallName
      name: CurrentOnCall
